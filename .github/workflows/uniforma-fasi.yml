name: Verifica fasi procedimenti

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica file e riferimenti comuni
        shell: bash
        run: |
          set -euo pipefail

          test -f phase-shell.css
          test -f phase-shell.js

          for dir in 027-26 031-26 044-26 052-26; do
            for file in fascicolo.html interrogatori.html indizi.html ricostruzione.html verdetto.html archivio.html; do
              path="$dir/$file"
              if [ -f "$path" ]; then
                grep -q 'phase-shell.css' "$path"
                grep -q 'phase-shell.js' "$path"
              fi
            done
          done

          echo "Verifica shell delle fasi completata."