name: Verify shared site style

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared stylesheet
        shell: bash
        run: |
          set -euo pipefail
          test -f site.css
          count=$(find . -type f -name '*.html' -not -path './.git/*' | wc -l)
          echo "Pagine HTML trovate: $count"
          test "$count" -gt 0
          echo "Design system presente e repository valido."
