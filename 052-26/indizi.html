<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>052/26 — Indizi</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><small>FASE 03 · INDIZI</small><h1>La prova è nella combinazione.</h1><p>Esamina almeno 7 elementi e scegli almeno 2 collegamenti che ritieni investigativamente significativi.</p><div id="list"></div><button id="go" type="button">COSTRUISCI I COLLEGAMENTI</button></main><script>const e=[['ACCESSO-01','Badge usato alle 22:43. Il titolare è identificabile solo incrociando il registro anagrafico.'],['ACCESSO-02','Secondo accesso alle 23:18. Il sistema registra il badge, non la persona fisica.'],['TEL-04','Il telefono della vittima registra un movimento alle 23:21.'],['CLOUD-02','Sincronizzazione automatica alle 23:24: non dimostra che Paolo fosse al computer.'],['RETE-07','Il computer riceve una connessione locale alle 23:21.'],['ASC-03','Telecamera dell\'ascensore guasta dalle 22:37 alle 00:02.'],['MAIL-09','Bozza non inviata: contiene un riferimento a un appuntamento cancellato.'],['AUTO-11','Auto di Stefano rilevata a 900 metri dallo studio alle 23:02.'],['PAR-06','Parcheggio: veicolo di Giulia registrato alle 21:51, uscita alle 22:06.'],['CHI-02','La vecchia chiave dello studio risulta essere stata sostituita, secondo il fabbro.']];let r=new Set(JSON.parse(localStorage.getItem('od_052_reviewed')||'[]'));const list=document.getElementById('list');e.forEach((x,i)=>{const d=document.createElement('div');d.className='e';d.innerHTML='<label><input type="checkbox"> <b>'+x[0]+'</b></label><p>'+x[1]+'</p>';const cb=d.querySelector('input');cb.checked=r.has(i);cb.addEventListener('change',()=>{cb.checked?r.add(i):r.delete(i);localStorage.setItem('od_052_reviewed',JSON.stringify([...r]))});list.appendChild(d)});document.getElementById('go').addEventListener('click',()=>{if(r.size<7){alert('Servono almeno 7 elementi esaminati.');return}const links=[['ACCESSO-02','AUTO-11'],['TEL-04','CLOUD-02']];localStorage.setItem('od_052_links',JSON.stringify(links));localStorage.setItem('od_052_indizi','1');localStorage.setItem('od_052_progress','70');location.href='ricostruzione.html'});if(localStorage.getItem('od_052_interrogations')!=='1'){document.body.innerHTML='<main><h1>Fase non disponibile</h1><p>Completa prima gli interrogatori.</p><a href="interrogatori.html">TORNA AGLI INTERROGATORI</a></main>'}</script><script src="../phase-shell.js"></script></body></html>
