<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>052/26 — Indizi</title><style>body{background:#08111f;color:#eee;font-family:Arial;max-width:900px;margin:auto;padding:35px}.e{background:#0d1929;padding:18px;margin:12px 0;border:1px solid #bda76a44}label{display:block;margin:8px 0}button{padding:12px;background:#bda76a;border:0;margin-top:18px}</style></head><body><small>FASE 03 · INDIZI</small><h1>La prova è nella combinazione.</h1><p>Esamina almeno 7 elementi e scegli almeno 2 collegamenti che ritieni investigativamente significativi.</p><div id="list"></div><button onclick="go()">COSTRUISCI I COLLEGAMENTI</button><script>const e=[['ACCESSO-01','Badge usato alle 22:43. Il titolare è identificabile solo incrociando il registro anagrafico.'],['ACCESSO-02','Secondo accesso alle 23:18. Il sistema registra il badge, non la persona fisica.'],['TEL-04','Il telefono della vittima registra un movimento alle 23:21.'],['CLOUD-02','Sincronizzazione automatica alle 23:24: non dimostra che Paolo fosse al computer.'],['RETE-07','Il computer riceve una connessione locale alle 23:21.'],['ASC-03','Telecamera dell\'ascensore guasta dalle 22:37 alle 00:02.'],['MAIL-09','Bozza non inviata: contiene un riferimento a un appuntamento cancellato.'],['AUTO-11','Auto di Stefano rilevata a 900 metri dallo studio alle 23:02.'],['PAR-06','Parcheggio: veicolo di Giulia registrato alle 21:51, uscita alle 22:06.'],['CHI-02','La vecchia chiave dello studio risulta essere stata sostituita, secondo il fabbro.']];let r=new Set(JSON.parse(localStorage.getItem('od_052_reviewed')||'[]'));let l=JSON.parse(localStorage.getItem('od_052_links')||'[]');const list=document.getElementById('list');e.forEach((x,i)=>{let d=document.createElement('div');d.className='e';d.innerHTML='<label><input type=checkbox '+(r.has(i)?'checked':'')+'> <b>'+x[0]+'</b></label><p>'+x[1]+'</p>';d.querySelector('input').onchange=ev=>{ev.target.checked?r.add(i):r.delete(i);localStorage.setItem('od_052_reviewed',JSON.stringify([...r]))};list.appendChild(d)});function go(){if(r.size<7){alert('Servono almeno 7 elementi esaminati.');return}l=[['ACCESSO-02','AUTO-11'],['TEL-04','CLOUD-02']];localStorage.setItem('od_052_links',JSON.stringify(l));localStorage.setItem('od_progress','70');location.href='ricostruzione.html'}</script></body></html>
