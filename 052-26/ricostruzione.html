<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>052/26 — Ricostruzione</title><style>body{background:#08111f;color:#eee;font-family:Arial;max-width:900px;margin:auto;padding:35px}.opt{background:#0d1929;padding:18px;margin:14px 0;border:1px solid #bda76a44}button{padding:12px;background:#bda76a;border:0}</style></head><body><small>FASE 04 · RICOSTRUZIONE</small><h1>Che cosa è realmente accaduto?</h1><div id="o"></div><button onclick="finish()">CONFERMA RICOSTRUZIONE</button><script>const opts=[['A','Accesso legittimo, confronto con Paolo e decesso accidentale.','Compatibile con alcuni dati, ma non spiega tutti gli accessi.'],['B','Una persona conosciuta da Paolo entra, il confronto degenera e lascia lo studio prima del decesso.','Richiede di spiegare perché alcuni dati digitali continuano dopo l\'uscita.'],['C','L\'aggressore usa un accesso già autorizzato, modifica la scena e sfrutta dati automatici per creare una falsa impressione temporale.','È la ricostruzione più complessa e richiede più passaggi indipendenti.'],['D','Il responsabile è identificabile semplicemente dal secondo accesso delle 23:18.','Non valido: il badge identifica un accesso, non chi lo ha materialmente utilizzato.']];const o=document.getElementById('o');opts.forEach(x=>{let d=document.createElement('div');d.className='opt';d.innerHTML='<h2>Ipotesi '+x[0]+'</h2><p>'+x[1]+'</p><small>'+x[2]+'</small><br><button onclick="pick(\''+x[0]+'\')">SELEZIONA</button>';o.appendChild(d)});function pick(x){localStorage.setItem('od_052_hyp',x);document.querySelectorAll('.opt').forEach(d=>d.style.opacity='.55');event.target.closest('.opt').style.opacity='1'}function finish(){if(!localStorage.getItem('od_052_hyp')){alert('Seleziona un\'ipotesi.');return}localStorage.setItem('od_052_reconstruction','1');localStorage.setItem('od_progress','90');location.href='verdetto.html'}</script></body></html>
