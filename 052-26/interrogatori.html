<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>052/26 — Interrogatori</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><small>FASE 02 · INTERROGATORI</small><h1>Non ci sono testimoni. Ci sono versioni.</h1><div id="app"></div><button id="next" type="button" style="display:none">PASSA AGLI INDIZI</button></main><script>const qs=[['Giulia Verri','Quando hai visto Paolo per l\'ultima volta?','21:40, a casa.'],['Giulia Verri','Avevi ancora una chiave dello studio?','Sì, ma sostiene di averla lasciata a Paolo mesi fa.'],['Stefano Riva','Perché hai chiamato Paolo alle 22:43?','Per un documento urgente. Nessuna risposta.'],['Stefano Riva','Dove eri tra le 22:30 e le 23:30?','A casa, ma il telefono non era con me per circa mezz\'ora.'],['Nadia Ferri','Chi può aprire la porta dello stabile?','I residenti con badge; esiste anche un accesso tecnico.'],['Nadia Ferri','Hai registrato anomalie?','Un badge risulta usato alle 23:18, ma il registro non mostra ancora il titolare.'],['Enrico Sala','Perché il computer di Paolo risultava attivo?','Avevo effettuato un aggiornamento remoto nel pomeriggio.'],['Enrico Sala','Hai effettuato accessi dopo le 22?','Il sistema mostra una connessione automatica alle 23:21.'],['Enrico Sala','Può una sincronizzazione sembrare attività dell\'utente?','Sì. Il backup cloud può partire senza che la persona tocchi il computer.']];let a=JSON.parse(localStorage.getItem('od_052_answers')||'{}');const app=document.getElementById('app'),next=document.getElementById('next');qs.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>'+q[0]+'</b><p>'+q[1]+'</p><button type="button">ACQUISISCI RISPOSTA</button><span></span>';d.querySelector('button').addEventListener('click',()=>{a[i]=q[2];localStorage.setItem('od_052_answers',JSON.stringify(a));d.querySelector('span').textContent=' ✓ '+q[2];if(Object.keys(a).filter(k=>Number.isInteger(Number(k))&&Number(k)>=0&&Number(k)<qs.length).length===qs.length){localStorage.setItem('od_052_interrogations','1');next.style.display='inline-block'}});app.appendChild(d)});next.addEventListener('click',()=>{if(localStorage.getItem('od_052_interrogations')==='1')location.href='indizi.html'});if(localStorage.getItem('od_052_case')!=='1'){document.body.innerHTML='<main><h1>Fase non disponibile</h1><p>Acquisisci prima il fascicolo del procedimento.</p><a href="fascicolo.html">TORNA AL FASCICOLO</a></main>'}</script><script src="../phase-shell.js"></script></body></html>
