<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>044/26 — Ricostruzione</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.7}main{max-width:900px;margin:auto;padding:45px 22px}.p{background:#111822;border:1px solid #303947;padding:22px;margin:15px 0}.tag{font:10px Arial;letter-spacing:2px;color:#c8b77d}.btn{display:inline-block;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;background:none;font:11px Arial;cursor:pointer}</style></head><body><main><div class="tag">FASE 04 · RICOSTRUZIONE · 044/26</div><h1>Segui la traccia digitale</h1><p>Seleziona almeno 5 eventi che ritieni sostenibili e formula una sola ipotesi principale.</p><div id="events"></div><section class="p"><div class="tag">IPOTESI</div><label><input type="radio" name="h" value="A"> A · Il messaggio è autentico e proveniva dalla persona attesa da Davide.</label><br><label><input type="radio" name="h" value="B"> B · Il messaggio è stato inviato da un soggetto che conosceva il piano di Davide, ma l'identità resta da provare.</label><br><label><input type="radio" name="h" value="C"> C · Il messaggio è una prova certa della presenza del mittente nello studio alle 23:17.</label><br><label><input type="radio" name="h" value="D"> D · La cancellazione dimostra che chi ha scritto il messaggio è l'autore della morte.</label></section><button class="btn" onclick="finish()">CONFERMA →</button><script>const E=[['23:16','Tablet associato all’account attivo'],['23:17:06','Connessione dati del telefono della vittima'],['23:17','Messaggio “Non venire” recuperato dal backup'],['23:18','Apertura elettronica dello studio'],['23:19–23:22','Figura nel corridoio, non identificata'],['23:21','Sincronizzazione del backup'],['23:24','Chiamata di 9 secondi verso “A”']];let s=new Set(JSON.parse(localStorage.od_044_events||'[]')),box=document.getElementById('events');E.forEach((x,i)=>box.innerHTML+=`<label class="p"><input type="checkbox" value="${i}" ${s.has(i)?'checked':''} onchange="this.checked?s.add(${i}):s.delete(${i});localStorage.od_044_events=JSON.stringify([...s])"> <b>${x[0]}</b> — ${x[1]}</label>`);function finish(){let h=document.querySelector('input[name=h]:checked');if(s.size<5||!h){alert('Seleziona almeno 5 eventi e un’ipotesi.');return}localStorage.od_044_reconstruction=JSON.stringify({events:[...s],hyp:h.value});location.href='verdetto.html'}</script></main></body></html>
