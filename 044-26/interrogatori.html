<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>044/26 — Interrogatori</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.6}main{max-width:950px;margin:auto;padding:40px 22px}.w{background:#111822;border:1px solid #303947;padding:20px;margin:16px 0}.q{display:block;width:100%;margin:8px 0;padding:12px;text-align:left;background:#0d131c;color:#eee;border:1px solid #384252;cursor:pointer}.ans{margin:10px 0;padding:14px;border-left:3px solid #c8b77d;background:#0d131c}.tag{font:10px Arial;letter-spacing:3px;color:#c8b77d}.btn{display:inline-block;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;text-decoration:none;font:11px Arial;letter-spacing:1px}</style></head><body><main><div class="tag">FASE 02 · INTERROGATORI · 044/26</div><h1>Chi ha scritto “Non venire”?</h1><p>Non cercare subito un colpevole. Cerca ciò che ogni persona può sapere e ciò che non dovrebbe sapere.</p><div id="app"></div><p><a class="btn" href="fascicolo.html">← FASCICOLO</a> <a class="btn" href="indizi.html">VAI AGLI INDIZI →</a></p><script>const W=[{id:'a',name:'Marta Lorenzi',role:'sorella',qs:[['Quando hai parlato con Davide?','Alle 22:48. Mi disse che sarebbe rimasto in studio ancora un po’.'],['Conoscevi il suo telefono?','Conoscevo il codice del vecchio telefono, non quello attuale.'],['Cosa significa per te “Non venire”?','Davide usava quella frase quando non voleva che qualcuno lo raggiungesse.'] ]},{id:'b',name:'Andrea Sala',role:'collega',qs:[['Hai scritto a Davide quella sera?','Sì, ma prima delle 23. Ho cancellato una conversazione dal mio telefono perché era personale.'],['Conoscevi il suo appuntamento?','Sapevo che aspettava qualcuno, non sapevo chi.'],['Hai ricevuto una risposta?','No. Almeno non una risposta che io abbia visto.'] ]},{id:'c',name:'Federica Neri',role:'vicina di studio',qs:[['Hai sentito rumori?','Verso le 23:20 ho sentito una voce maschile nel corridoio.'],['Hai visto Davide?','No. Ho visto soltanto una persona entrare nella zona degli studi.'],['Hai riconosciuto la persona?','No, ma aveva un telefono acceso in mano.'] ]}];let A=JSON.parse(localStorage.od_044_answers||'{}'),app=document.getElementById('app');W.forEach(w=>{let d=document.createElement('div');d.className='w';d.innerHTML='<div class="tag">'+w.role.toUpperCase()+'</div><h2>'+w.name+'</h2>';w.qs.forEach((q,i)=>{let id=w.id+i,b=document.createElement('button');b.className='q';b.textContent='▸ '+q[0];b.onclick=()=>{A[id]=1;localStorage.od_044_answers=JSON.stringify(A);let x=document.createElement('div');x.className='ans';x.textContent=q[1];b.after(x);b.disabled=true};d.appendChild(b)});app.appendChild(d)});</script></main></body></html>
