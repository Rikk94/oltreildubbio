tima verso un numero salvato come “A”. Durata 9 secondi.'],['key','ACCESS-08 · studio','Il registro elettronico segnala apertura della porta alle 23:18. Il badge utilizzato non è ancora attribuito con certezza.']];let R=new Set(JSON.parse(localStorage.od_044_reviewed||'[]')),g=document.getElementById('g');E.forEach(x=>{g.innerHTML+=`<label class="e"><input type="checkbox" value="${x[0]}" ${R.has(x[0])?'checked':''} onchange="this.checked?R.add(this.value):R.delete(this.value);localStorage.od_044_reviewed=JSON.stringify([...R])"><div class="tag">${x[1]}</div><p>${x[2]}</p></label>`});</script></main></body></html>
