<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oltre il Dubbio — Sentenza</title><style>body{margin:0;background:#090b0f;color:#eeeae0;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:50px 24px}.locked{padding:30px;background:#151820;border:1px solid #665a34;border-radius:8px;color:#aaa;line-height:1.7}.btn{display:inline-block;margin-top:18px;padding:12px 18px;border:1px solid #c8b77d;color:#c8b77d;text-decoration:none}.paper{background:#eee9df;color:#202020;padding:45px;margin-top:30px;font-family:Georgia,serif}.choice{display:inline-block;padding:15px;margin:5px;border:1px solid #665a34;cursor:pointer}.choice.sel{background:#c8b77d;color:#111}.actions{margin-top:25px}button{padding:12px 18px;cursor:pointer}</style></head><body><main class="wrap"><div id="app"></div></main><script>if(localStorage.getItem('od_reconstruction_complete')!=='true'){document.getElementById('app').innerHTML='<h1>Verdetto non ancora disponibile</h1><div class="locked">Prima devi completare la FASE 04 · RICOSTRUZIONE. La decisione finale può essere formulata solo dopo aver costruito una ricostruzione dei fatti.</div><a class="btn" href="ricostruzione.html">← Torna alla ricostruzione</a>';}else{document.getElementById('app').innerHTML=`<div style="font-size:11px;letter-spacing:3px;color:#c8b77d">FASE 05 · VERDETTO</div><h1>La decisione finale</h1><p>Scegli l'esito sulla base dell'indagine realmente svolta.</p><div id="choices"><div class="choice" data-v="colpevole">RESPONSABILITÀ AFFERMATA</div><div class="choice" data-v="dubbio">ASSOLUZIONE PER DUBBIO</div><div class="choice" data-v="insufficiente">PROVE INSUFFICIENTI</div><div class="choice" data-v="responsabilita-parziale">QUADRO NON UNIVOCO</div></div><div id="paper" class="paper" style="display:none"></div><div class="actions"><button id="confirm" disabled>Pronuncia il verdetto</button></div>`;let verdict='';document.querySelectorAll('.choice').forEach(c=>c.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');verdict=c.dataset.v;document.getElementById('confirm').disabled=false});document.getElementById('confirm').onclick=()=>{localStorage.setItem('od_verdict',verdict);localStorage.setItem('od_progress','100');const labels={colpevole:'RESPONSABILITÀ AFFERMATA',dubbio:'ASSOLUZIONE PER DUBBIO',insufficiente:'PROVE INSUFFICIENTI',responsabilita-parziale:'QUADRO NON UNIVOCO'};document.getElementById('paper').style.display='block';document.getElementById('paper').innerHTML='<h2>TRIBUNALE SIMULATO</h2><p>PROCEDIMENTO N. 014/26</p><h3>DISPOSITIVO</h3><p>Il giocatore pronuncia: <strong>'+labels[verdict]+'</strong>.</p><p>La presente sentenza è una simulazione narrativa. L’esito deve essere letto alla luce degli elementi effettivamente acquisiti, delle incertezze rimaste e della ricostruzione depositata.</p><p><strong>Decisione registrata nel fascicolo.</strong></p><div style="margin-top:25px"><a class="btn" href="archivio.html">Accedi all'archivio finale →</a></div>';document.getElementById('confirm').disabled=true}}}</script></body></html>
