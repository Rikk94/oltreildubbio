<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>074/26 — Archivio</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><section class="panel"><div class="tag">FASE 06 · ARCHIVIO</div><h1>074/26 — L'Ultima Telefonata</h1><p>Il procedimento è chiuso. L’archivio conserva la tua lettura della cronologia e il livello di prudenza investigativa.</p></section><section class="panel"><h2 id="out"></h2><p id="score"></p><p id="stats"></p></section><section class="panel"><div class="tag">CRONOLOGIA ACQUISITA</div><p id="timeline"></p></section><button id="replay" class="btn">RIPETI IL PROCEDIMENTO</button> <a class="btn" href="../casi.html">I CASI</a></main><script src="../phase-shell.js"></script><script>if(!localStorage.od_074_verdict)location.replace('fascicolo.html');const v=JSON.parse(localStorage.od_074_verdict||'{}'),e=JSON.parse(localStorage.od_074_reviewed||'[]'),u=JSON.parse(localStorage.od_074_unlocked||'[]'),t=JSON.parse(localStorage.od_074_timeline||'[]');document.getElementById('out').textContent=v.title||'Esito non disponibile';const score=Math.min(100,e.length*7+u.length*8+t.length*4);document.getElementById('score').textContent='Qualità investigativa: '+score+'/100';document.getElementById('stats').textContent='Elementi: '+e.length+' · Piste sbloccate: '+u.length+' · Eventi timeline: '+t.length;document.getElementById('timeline').textContent=t.length?t.join(' → '):'Nessuna timeline registrata.';document.getElementById('replay').onclick=function(){Object.keys(localStorage).filter(k=>k.indexOf('od_074_')===0).forEach(k=>localStorage.removeItem(k));location.href='fascicolo.html'};</script></body></html>
