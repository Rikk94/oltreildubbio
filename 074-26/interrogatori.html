<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>074/26 — Interrogatori</title><link rel="stylesheet" href="../phase-shell.css"><style>.q{padding:18px 0;border-top:1px solid #303947}.opt{display:block;padding:8px 0}</style></head><body><main><section class="panel"><div class="tag">FASE 02 · INTERROGATORI</div><h1>Chi sapeva della telefonata?</h1><p>Le testimonianze non servono solo a trovare un sospetto. Servono a capire quali eventi telefonici meritano un controllo.</p></section><section id="box" class="panel"></section><button id="go" class="btn">CHIUDI GLI INTERROGATORI →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>if(localStorage.od_074_case!=='1')location.replace('fascicolo.html');const qs=[['q1','Andrea Bellini','Perché hai ricevuto la chiamata delle 23:47?',['A','Marta sembrava agitata.','B','Non ricordo cosa disse.','C','Mi chiese di non richiamarla.']],['q2','Andrea Bellini','Conoscevi il numero “L.”?',['A','Sì, era Lorenzo.','B','No.','C','Pensavo fosse un numero di lavoro.']],['q3','Lorenzo Riva','Hai parlato con Marta alle 23:52?',['A','Sì, per circa due minuti.','B','No, non quella sera.','C','Ho ricevuto una chiamata persa.']],['q4','Sara Conti','Quando hai visto Marta l’ultima volta?',['A','23:30 circa.','B','Prima delle 22:00.','C','Non lo so con precisione.']],['q5','Andrea Bellini','Marta aveva paura di qualcuno?',['A','Non mi fece un nome.','B','Disse il nome Lorenzo.','C','Parlò di un incontro.']],['q6','Lorenzo Riva','Dove eri alle 00:03?',['A','A casa.','B','In auto, senza ricordare il percorso.','C','Al lavoro.']],['q7','Sara Conti','Hai mai visto il telefono di Marta quella sera?',['A','No.','B','Sì, prima delle 23:00.','C','Sì, dopo mezzanotte.']],['q8','Andrea Bellini','Perché non hai richiamato Marta?',['A','Mi disse esplicitamente di non farlo.','B','Pensavo fosse uno scherzo.','C','Il telefono era spento.']]];let ans=JSON.parse(localStorage.od_074_answers||'{}'),box=document.getElementById('box');qs.forEach(x=>{let s='<div class="q"><b>'+x[1]+'</b><p>'+x[2]+'</p>';s+='<label class="opt"><input type="radio" name="'+x[0]+'" value="A"> A — '+x[3][1]+'</label><label class="opt"><input type="radio" name="'+x[0]+'" value="B"> B — '+x[3][3]+'</label><label class="opt"><input type="radio" name="'+x[0]+'" value="C"> C — '+x[3][5]+'</label></div>';box.insertAdjacentHTML('beforeend',s)});box.addEventListener('change',e=>{ans[e.target.name]=e.target.value;localStorage.od_074_answers=JSON.stringify(ans)});document.getElementById('go').onclick=function(){if(Object.keys(ans).length<8){document.getElementById('msg').textContent='Acquisisci tutte le otto risposte.';return}let unlock=[];if(ans.q2==='A')unlock.push('L-number');if(ans.q3==='A')unlock.push('L-call');if(ans.q6==='B')unlock.push('cell-route');if(ans.q7==='C')unlock.push('post-midnight');localStorage.od_074_unlocked=JSON.stringify(unlock);localStorage.od_074_interrogations='1';localStorage.od_074_progress='40';location.href='indizi.html'};</script></body></html>
