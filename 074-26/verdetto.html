<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>074/26 — Verdetto</title><link rel="stylesheet" href="../phase-shell.css"><style>body{overflow-x:hidden}.judgment{margin-top:18px}.verdict-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}</style></head><body><main><section class="panel"><div class="tag">FASE 05 · VERDETTO</div><h1>L'Ultima Telefonata</h1><p>Il momento in cui l'indagine smette di essere una raccolta di dati e diventa una decisione.</p></section><section id="j" class="judgment verdict-screen"></section><div class="verdict-actions"><button id="save" class="btn">DEPOSITA IL VERDETTO →</button><a class="btn" href="fascicolo.html">TORNA AL FASCICOLO</a></div></main><script src="../phase-shell.js"></script><script>if(!localStorage.od_074_reconstruction)location.replace('fascicolo.html');const r=JSON.parse(localStorage.od_074_reconstruction),u=JSON.parse(localStorage.od_074_unlocked||'[]'),e=JSON.parse(localStorage.od_074_reviewed||'[]');let type='open',title='SCOMPARSA NON RISOLTA',reason='La cronologia contiene anomalie, ma non consente di stabilire con chi fosse Marta dopo le 23:47.';if(r.hyp==='B'&&u.includes('L-call')){type='second';title='IPOTESI DEL SECONDO UTILIZZATORE';reason='La chiamata a Lorenzo e il successivo movimento del dispositivo rendono plausibile l’intervento di una seconda persona, ma non provano che Marta non fosse con il telefono.'}else if(r.hyp==='D'){type='accusation';title='ACCUSA RESPINTA';reason='La presenza del numero di Lorenzo nel tabulato non dimostra che Lorenzo abbia incontrato Marta o utilizzato il dispositivo.'}else if(r.hyp==='A'){type='voluntary';title='ALLONTANAMENTO VOLONTARIO: POSSIBILE';reason='La sequenza delle celle è compatibile con uno spostamento, ma non identifica chi portasse il telefono.'}else if(r.hyp==='C'){type='limits';title='RICOSTRUZIONE PRUDENTE';reason='Hai riconosciuto il limite principale della prova: la posizione del dispositivo non equivale alla posizione certa della persona.'}document.getElementById('j').innerHTML='<span class="stamp">ESITO · '+type.toUpperCase()+'</span><h2>DECISIONE</h2><p class="decision">'+title+'</p><p class="reason">'+reason+'</p><div class="metrics"><div class="metric"><b>'+e.length+'</b><span>ELEMENTI ESAMINATI</span></div><div class="metric"><b>'+u.length+'</b><span>PISTE SBLOCCATE</span></div><div class="metric"><b>'+r.events.length+'</b><span>EVENTI RICOSTRUITI</span></div></div><p class="reason" style="margin-top:26px"><b>Principio investigativo:</b> una cella individua un’area di rete; un tabulato documenta traffico; nessuno dei due, da solo, identifica la persona che aveva il telefono.</p>';document.getElementById('save').onclick=function(){localStorage.od_074_verdict=JSON.stringify({type,title,reason,hyp:r.hyp});localStorage.od_074_progress='100';location.href='archivio.html'};</script></body></html>
