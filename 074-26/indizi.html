<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>074/26 — Indizi</title><link rel="stylesheet" href="../phase-shell.css"><style>.e{padding:16px 0;border-top:1px solid #303947}.tag{margin-bottom:6px}.timeline{display:grid;gap:8px}.slot{padding:10px;border:1px solid #303947}</style></head><body><main><section class="panel"><div class="tag">FASE 03 · INDIZI</div><h1>Il telefono non mente. Ma non racconta tutto.</h1><p>Analizza chiamate, messaggi e celle. Poi prova a ordinare gli eventi. Alcuni dati sono disponibili solo se una testimonianza ti ha portato sulla pista corretta.</p></section><section id="evidence" class="panel"></section><section class="panel"><div class="tag">TIMELINE</div><p>Seleziona gli eventi nell’ordine che ritieni più probabile.</p><div id="timeline" class="timeline"></div><button id="save" class="btn">BLOCCA LA CRONOLOGIA →</button><p id="msg"></p></section><button id="go" class="btn">PASSA ALLA RICOSTRUZIONE →</button></main><script src="../phase-shell.js"></script><script>if(localStorage.od_074_interrogations!=='1')location.replace('fascicolo.html');const unlock=JSON.parse(localStorage.od_074_unlocked||'[]'),base=[['E01','23:47 — chiamata Andrea','41 secondi, chiamata in entrata.'],['E02','23:52 — chiamata al numero “L.”','Numero non ancora identificato.'],['E03','00:03 — nuova cella','Il dispositivo aggancia una cella nella zona Darsena.'],['E04','00:18 — ultimo segnale','Il telefono smette di rispondere.'],['E05','06:34 — dichiarazione Andrea','Riferisce la frase pronunciata da Marta.'],['E06','Cella 23:47','Area compatibile con la zona Navigli.'],['E07','Cella 00:03','Area compatibile con Darsena e vie limitrofe.'],['E08','Nessuna chiamata 23:48–23:51','Intervallo privo di traffico registrato.']],extra=[['L-number','E09 · Numero “L.” identificato','Il numero appartiene a Lorenzo Riva.'],['L-call','E10 · Durata chiamata 23:52','La chiamata dura 2 minuti e 06 secondi.'],['cell-route','E11 · Percorso celle','Il passaggio tra le celle è compatibile con uno spostamento in auto.'],['post-midnight','E12 · Attività dopo mezzanotte','Alle 00:11 risulta un tentativo di connessione dati.']];const data=base.concat(extra.filter(x=>unlock.includes(x[0])));let seen=JSON.parse(localStorage.od_074_reviewed||'[]'),ev=document.getElementById('evidence');data.forEach(x=>ev.insertAdjacentHTML('beforeend','<label class="e"><input type="checkbox" value="'+x[1]+'" '+(seen.includes(x[1])?'checked':'')+'> <b>'+x[1]+'</b><br>'+x[2]+'</label>'));let order=JSON.parse(localStorage.od_074_timeline||'[]'),tl=document.getElementById('timeline');data.forEach(x=>{let id=x[1];tl.insertAdjacentHTML('beforeend','label class="slot"><input type="checkbox" value="'+id+'"> '+id+'</label>')});document.getElementById('save').onclick=function(){seen=[...ev.querySelectorAll('input:checked')].map(x=>x.value);order=[...tl.querySelectorAll('input:checked')].map(x=>x.value);localStorage.od_074_reviewed=JSON.stringify(seen);localStorage.od_074_timeline=JSON.stringify(order);document.getElementById('msg').textContent='Cronologia acquisita: '+order.length+' eventi selezionati.'};document.getElementById('go').onclick=function(){if(seen.length<7||order.length<4){document.getElementById('msg').textContent='Servono almeno 7 elementi esaminati e 4 eventi in timeline.';return}localStorage.od_074_indizi='1';localStorage.od_074_progress='60';location.href='ricostruzione.html'};</script></body></html>
