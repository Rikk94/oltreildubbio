<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Ricostruzione</title><link rel="stylesheet" href="../phase-shell.css"><style>.question{display:block;padding:14px 0;border-top:1px solid #303947}.warning{color:#c8b77d}</style></head><body><main><section class="panel"><div class="tag">FASE 04 · RICOSTRUZIONE</div><h1>Costruisci la notte</h1><p>Non devi scegliere ciò che sembra più convincente. Devi scegliere ciò che può convivere con le prove che hai acquisito.</p></section><section id="events" class="panel"></section><section class="panel"><div class="tag">IPOTESI</div><label class="question"><input type="radio" name="h" value="A"> A — Un intruso è entrato dalla porta e ha agito tra le 23:20 e le 00:10.</label><label class="question"><input type="radio" name="h" value="B"> B — L’accesso era compatibile con una persona autorizzata; la porta aperta non identifica l’autore.</label><label class="question"><input type="radio" name="h" value="C"> C — L’aggressore è entrato dalla finestra.</label><label class="question"><input type="radio" name="h" value="D"> D — Gli elementi raccolti consentono già di identificare Claudia come responsabile.</label></section><button id="go" class="btn">CONFERMA RICOSTRUZIONE →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>
if(localStorage.getItem('od_061_indizi')!=='1'){location.replace('fascicolo.html')}
const reviewed=JSON.parse(localStorage.od_061_reviewed||'[]'),unlocked=JSON.parse(localStorage.od_061_unlocked||'[]');
const events=[['E01','Andrea è nell’appartamento prima delle 23:12'],['E02','Una persona entra nel palazzo alle 23:03'],['E03','Andrea sblocca il telefono alle 23:18'],['E04','Il decesso è compatibile con 23:20–00:10'],['E05','Il vicino colloca un rumore alle 23:41'],['E06','La porta non presenta effrazione evidente'],['E07','La finestra resta aperta di circa dieci centimetri'],['E08','Le impronte sul calice sono miste e non attribuite'],['E09','Una persona scende dal piano alle 23:45'],['E10','Claudia ha ancora una chiave'],['E11','Una vecchia copia delle chiavi non è stata recuperata'],['E12','La copia di Paolo risulta temporaneamente irreperibile']];
const box=document.getElementById('events');events.forEach((x,i)=>{if(reviewed.includes(x[0]))box.insertAdjacentHTML('beforeend','<label class="question"><input type="checkbox" value="'+x[0]+'" checked> '+(i+1)+'. '+x[1]+'</label>');else if(unlocked.includes(x[0]))box.insertAdjacentHTML('beforeend','<label class="question"><input type="checkbox" value="'+x[0]+'"> '+(i+1)+'. '+x[1]+'</label>')});
document.getElementById('go').onclick=function(){const chosen=[...document.querySelectorAll('#events input:checked')].map(x=>x.value),h=document.querySelector('input[name=h]:checked');if(chosen.length<5||!h){document.getElementById('msg').textContent='Seleziona almeno 5 passaggi e un’ipotesi.';return}localStorage.od_061_reconstruction=JSON.stringify({events:chosen,hyp:h.value});localStorage.od_061_hyp=h.value;localStorage.od_061_progress='80';location.href='verdetto.html'};
</script></body></html>
