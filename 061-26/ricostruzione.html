<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Ricostruzione</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><section class="panel"><div class="tag">FASE 04 · RICOSTRUZIONE</div><h1>Costruisci ciò che è dimostrabile</h1><p>Seleziona almeno cinque passaggi compatibili con i dati acquisiti.</p></section><section id="events" class="panel"></section><section class="panel"><div class="tag">IPOTESI</div><label><input type="radio" name="h" value="A"> A — Un intruso è entrato dalla porta.</label><br><label><input type="radio" name="h" value="B"> B — La porta aperta è compatibile con un accesso autorizzato e non dimostra da sola un ingresso clandestino.</label><br><label><input type="radio" name="h" value="C"> C — La finestra dimostra che l’aggressore è entrato da lì.</label><br><label><input type="radio" name="h" value="D"> D — La testimonianza del vicino identifica il responsabile.</label></section><button id="go" class="btn">CONFERMA RICOSTRUZIONE →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>if(localStorage.getItem('od_061_indizi')!=='1'){location.replace('fascicolo.html')}const events=['Andrea riceve un messaggio alle 23:12','Una persona entra nel palazzo alle 23:03','Il telefono viene sbloccato alle 23:18','Il vicino sente un rumore alle 23:41','La finestra resta parzialmente aperta','La morte è compatibile con la finestra 23:20–00:10','La porta non mostra effrazione','Il bicchiere presenta impronte ancora da attribuire'];const box=document.getElementById('events');events.forEach((e,i)=>box.insertAdjacentHTML('beforeend','<label class="question"><input type="checkbox" value="'+i+'"> '+(i+1)+'. '+e+'</label>'));document.getElementById('go').onclick=function(){const chosen=[...document.querySelectorAll('#events input:checked')].map(x=>x.value);const h=document.querySelector('input[name=h]:checked');if(chosen.length<
