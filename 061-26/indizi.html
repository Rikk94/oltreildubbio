<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Indizi</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><section class="panel"><div class="tag">FASE 03 · INDIZI</div><h1>La porta non racconta tutta la storia</h1><p>Esamina gli elementi e collega almeno due fatti compatibili.</p></section><section id="evidence" class="panel"></section><section class="panel"><div class="tag">COLLEGAMENTO</div><select id="a"><option value="">Primo elemento</option></select><select id="b"><option value="">Secondo elemento</option></select><button id="link" class="btn">REGISTRA COLLEGAMENTO</button><p id="links">Collegamenti: 0</p></section><button id="confirm" class="btn">CHIUDI ANALISI →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>if(localStorage.getItem('od_061_interrogations')!=='1'){location.replace('fascicolo.html')}const data=[['E01','Porta accostata','Nessun segno evidente di effrazione.'],['E02','Finestra','Aperta di circa dieci centimetri.'],['E03','Rumore','Il vicino colloca un rumore secco alle 23:41.'],['E04','Telefono','Ultimo sblocco registrato alle 23:18.'],['E05','Messaggio','Claudia riferisce un contatto con Andrea alle 23:12.'],['E06','Chiave','Paolo dichiara di possedere una copia.'],['E07','Chiave di Claudia','Claudia sostiene di averla restituita mesi prima.'],['E08','Orario medico-legale','Finestra di morte 23:20–00:10.'],['E09','Calice','Un bicchiere presenta impronte miste non ancora attribuite.'],['E10','Telecamera','La telecamera del piano terra mostra una persona entrare alle 23:03, ma il volto non è distinguibile.']];const box=document.getElementById('evidence'),A=document.getElementById('a'),B=document.getElementById('b');data.forEach(x=>{box.insertAdjacentHTML('beforeend','<label class="question"><input type="checkbox" value="'+x[0]+'"> <b>'+x[0]+' · '+x[1]+'</b><br>'+x[2]+'</label>');[A,B].forEach(s=>s.insertAdjacentHTML('beforeend','<option value="'+x[0]+'">'+x[0]+' · '+x[1]+'</option>'))});let links=JSON.parse(localStorage.od_061_links||'[]');document.getElementById('link').onclick=function(){if(!A.value||!B.value||A.value===B.value)return;let k=[A.value,B.value].sort().join('-');if(!links.includes(k))links.push(k);localStorage.od_061_links=JSON.stringify(links);document.getElementById('links').textContent='Collegamenti: '+links.length};document.getElementById('confirm').onclick=function(){const reviewed=[...document.querySelectorAll('#evidence input:checked')].map(x=>x.value);if(reviewed.length<7||links.length<1){document.getElementById('msg').textContent='Servono almeno 7 elementi esaminati e un collegamento motivato.';return}localStorage.setItem('od_061_reviewed',JSON.stringify(reviewed));localStorage.setItem('od_061_indizi','1');localStorage.setItem('od_061_progress','60');location.href='ricostruzione.html'}</script></body></html>
