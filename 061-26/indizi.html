<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Indizi</title><link rel="stylesheet" href="../phase-shell.css"><style>.question{display:block;padding:15px 0;border-top:1px solid #303947}.locked{opacity:.5}.tag{margin-top:8px}</style></head><body><main><section class="panel"><div class="tag">FASE 03 · INDIZI</div><h1>Quello che hai scelto di cercare</h1><p>Gli interrogatori hanno aperto alcune piste. Non tutti gli elementi del fascicolo sono visibili a ogni investigatore.</p></section><section id="evidence" class="panel"></section><section class="panel"><div class="tag">COLLEGAMENTI</div><select id="a"><option value="">Primo elemento</option></select> <select id="b"><option value="">Secondo elemento</option></select> <button id="link" class="btn">REGISTRA</button><p id="links">Collegamenti: 0</p></section><button id="confirm" class="btn">CHIUDI ANALISI →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>
if(localStorage.getItem('od_061_interrogations')!=='1'){location.replace('fascicolo.html')}
const answers=JSON.parse(localStorage.od_061_answers||'{}'),unlocked=JSON.parse(localStorage.od_061_unlocked||'[]');
const data=[
['E01','Porta accostata','Nessun segno evidente di effrazione.','base'],['E02','Finestra','Aperta di circa dieci centimetri.','base'],['E03','Rumore 23:41','Il vicino colloca un rumore secco alle 23:41.','base'],['E04','Telefono 23:18','Ultimo sblocco registrato alle 23:18.','base'],['E05','Contatto 23:12','Claudia riferisce un contatto con Andrea alle 23:12.','base'],['E06','Chiave di Paolo','Il proprietario dichiara di possedere una copia.','base'],['E07','Chiave di Claudia','Claudia sostiene di averla restituita mesi prima.','base'],['E08','Finestra di morte','23:20–00:10.','base'],['E09','Calice','Impronte miste non ancora attribuite.','base'],['E10','Telecamera 23:03','Una persona entra nel palazzo; volto non distinguibile.','base'],['E11','Passi sul pianerottolo','Marco riferisce di aver visto una persona scendere alle 23:45.','unlock'],['E12','Chiave ancora posseduta','Claudia ammette di avere ancora una chiave, se hai scelto di contestarla.','unlock'],['E13','Risposta delle 23:18','La chat mostra attività compatibile con una risposta ricevuta alle 23:18.','unlock'],['E14','Vecchia copia','Paolo ammette l’esistenza di una vecchia copia non recuperata.','unlock'],['E15','Copia mancante','Paolo dichiara che la propria copia non era dove la teneva.','unlock']];
const visible=data.filter(x=>x[3]==='base'||unlocked.includes(x[0]));const box=document.getElementById('evidence'),A=document.getElementById('a'),B=document.getElementById('b');
visible.forEach(x=>{box.insertAdjacentHTML('beforeend','<label class="question"><input type="checkbox" value="'+x[0]+'"> <b>'+x[0]+' · '+x[1]+'</b><br>'+x[2]+'</label>');[A,B].forEach(s=>s.insertAdjacentHTML('beforeend','<option value="'+x[0]+'">'+x[0]+' · '+x[1]+'</option>'))});
let links=JSON.parse(localStorage.od_061_links||'[]');document.getElementById('links').textContent='Collegamenti: '+links.length;document.getElementById('link').onclick=function(){if(!A.value||!B.value||A.value===B.value)return;let k=[A.value,B.value].sort().join('-');if(!links.includes(k))links.push(k);localStorage.od_061_links=JSON.stringify(links);document.getElementById('links').textContent='Collegamenti: '+links.length};
document.getElementById('confirm').onclick=function(){const reviewed=[...document.querySelectorAll('#evidence input:checked')].map(x=>x.value);if(reviewed.length<8||links.length<2){document.getElementById('msg').textContent='Servono almeno 8 elementi esaminati e 2 collegamenti motivati.';return}localStorage.od_061_reviewed=JSON.stringify(reviewed);localStorage.od_061_indizi='1';localStorage.od_061_progress='60';location.href='ricostruzione.html'};
</script></body></html>
