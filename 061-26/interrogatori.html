<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Interrogatori</title><link rel="stylesheet" href="../phase-shell.css"><style>.question{padding:18px 0;border-top:1px solid #303947}.option{display:block;padding:9px 0}.locked{opacity:.45}.hint{font-size:13px;color:#aaa}</style></head><body><main><section class="panel"><div class="tag">FASE 02 · INTERROGATORI</div><h1>Le persone che erano vicine</h1><p>Non tutte le domande producono la stessa informazione. Una risposta può aprire una pista; un'altra può chiuderla.</p></section><section id="questions" class="panel"></section><button id="confirm" class="btn">CHIUDI GLI INTERROGATORI →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>
if(localStorage.getItem('od_061_case')!=='1'){location.replace('fascicolo.html')}
const qs=[
{id:'q1',who:'Elisa Valenti',q:'Dov’era tra le 23:00 e mezzanotte?',opts:[['A','A casa. Ricorda di aver ricevuto una chiamata alle 23:26.'],['B','A casa, ma non sa indicare alcun orario.'],['C','Era uscita e rientrata poco prima di mezzanotte.']]},
{id:'q2',who:'Elisa Valenti',q:'Quando ha visto Andrea l’ultima volta?',opts:[['A','Alle 22:55. Era tranquillo.'],['B','Alle 23:10. Stavano discutendo.'],['C','Non lo ricorda con certezza.']]},
{id:'q3',who:'Marco De Santis',q:'Che cosa ha sentito alle 23:41?',opts:[['A','Un rumore secco, come qualcosa caduto.'],['B','Voci e poi un rumore secco.'],['C','Solo un rumore indefinito.']]},
{id:'q4',who:'Marco De Santis',q:'Ha visto qualcuno sul pianerottolo?',opts:[['A','No.'],['B','Una persona scendere le scale intorno alle 23:45.'],['C','Ha sentito passi, ma non ha visto nessuno.']]},
{id:'q5',who:'Federico Neri',q:'Andrea aveva appuntamenti quella sera?',opts:[['A','Un incontro di lavoro era stato rinviato alle 21:30.'],['B','Sapeva di un incontro dopo le 23:00.'],['C','Non ne sa nulla.']]},
{id:'q6',who:'Claudia Riva',q:'Ha ancora una chiave dell’appartamento?',opts:[['A','No, l’ha restituita mesi fa.'],['B','Sì, ma non l’ha usata.'],['C','Non vuole rispondere.']]},
{id:'q7',who:'Claudia Riva',q:'Quando ha parlato con Andrea l’ultima volta?',opts:[['A','Alle 23:12. Solo messaggi.'],['B','Alle 23:12 e poi ha ricevuto una risposta alle 23:18.'],['C','Prima delle 22:00.']]},
{id:'q8',who:'Paolo Serra',q:'Chi può avere una copia delle chiavi?',opts:[['A','Lui e Andrea.'],['B','Lui, Andrea e una vecchia copia non ancora recuperata.'],['C','Non ne è sicuro.']]},
{id:'q9',who:'Claudia Riva',q:'Ti contesto: come sai che Andrea ha ricevuto il messaggio alle 23:12?',opts:[['A','Perché era nella chat e vide la doppia spunta.'],['B','Perché Andrea glielo disse in una telefonata.'],['C','Non può dimostrarlo.']]},
{id:'q10',who:'Paolo Serra',q:'Ti contesto: hai controllato la tua copia quella notte?',opts:[['A','No.'],['B','Sì, era ancora nel mio cassetto.'],['C','La copia non era più dove la tenevo.']]}
];
const answers=JSON.parse(localStorage.od_061_answers||'{}');const box=document.getElementById('questions');
function render(){box.innerHTML='';qs.forEach((x,i)=>{let unlocked=i<8||answers.q6==='C'||answers.q7==='B'||answers.q8==='B';if(!unlocked)return;let h='<div class="question"><b>'+x.who+'</b><p>'+x.q+'</p>';x.opts.forEach(o=>{h+='<label class="option"><input type="radio" name="'+x.id+'" value="'+o[0]+'" '+(answers[x.id]===o[0]?'checked':'')+'> '+o[0]+' — '+o[1]+'</label>'});h+='</div>';box.insertAdjacentHTML('beforeend',h)})}
render();
box.addEventListener('change',e=>{if(!e.target.matches('input'))return;answers[e.target.name]=e.target.value;localStorage.od_061_answers=JSON.stringify(answers);render()});
document.getElementById('confirm').onclick=function(){if(Object.keys(answers).length<8){document.getElementById('msg').textContent='Devi acquisire almeno le otto deposizioni iniziali.';return}let unlocked=[];if(answers.q4==='B')unlocked.push('E11');if(answers.q6==='B')unlocked.push('E12');if(answers.q7==='B')unlocked.push('E13');if(answers.q8==='B')unlocked.push('E14');if(answers.q10==='C')unlocked.push('E15');localStorage.od_061_unlocked=JSON.stringify(unlocked);localStorage.od_061_interrogations='1';localStorage.od_061_progress='40';location.href='indizi.html'};
</script></body></html>
