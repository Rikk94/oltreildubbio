<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Interrogatori</title><link rel="stylesheet" href="../phase-shell.css"></head><body><main><section class="panel"><div class="tag">FASE 02 · INTERROGATORI</div><h1>Le persone che erano vicine</h1><p>Le risposte non sono automaticamente vere o false. Cerca dettagli verificabili e contraddizioni.</p></section><section id="questions" class="panel"></section><button id="confirm" class="btn">CHIUDI GLI INTERROGATORI →</button><p id="msg"></p></main><script src="../phase-shell.js"></script><script>if(localStorage.getItem('od_061_case')!=='1'){location.replace('fascicolo.html')}const qs=[['q1','Elisa Valenti','Dov’era tra le 23:00 e mezzanotte?','A casa, ma non ricorda l’orario esatto.'],['q2','Elisa Valenti','Quando ha visto Andrea l’ultima volta?','Alle 22:55. Dice che era tranquillo.'],['q3','Marco De Santis','Ha sentito qualcuno entrare?','No. Ricorda solo il rumore secco delle 23:41.'],['q4','Marco De Santis','La porta era aperta quando è uscito sul pianerottolo?','Non sa dirlo: non ha guardato verso il 4B.'],['q5','Federico Neri','Andrea aveva appuntamenti quella sera?','Un incontro di lavoro era stato rinviato alle 21:30.'],['q6','Claudia Riva','Ha ancora una chiave dell’appartamento?','Sostiene di averla restituita mesi prima.'],['q7','Paolo Serra','Chi possiede una copia delle chiavi?','Lui e la vittima; dice di non aver usato la propria da settimane.'],['q8','Claudia Riva','Quando ha parlato con Andrea l’ultima volta?','Alle 23:12 tramite messaggio, ma non dice di averlo visto.']];const box=document.getElementById('questions');qs.forEach(q=>{box.insertAdjacentHTML('beforeend','<div class="question"><b>'+q[1]+'</b><p>'+q[2]+'</p><label><input type="radio" name="'+q[0]+'" value="'+q[3].replace(/"/g,'&quot;')+'"> Acquisisci la risposta</label></div>')});document.getElementById('confirm').onclick=function(){const answers={};let ok=true;qs.forEach(q=>{const el=document.querySelector('input[name="'+q[0]+'"]:checked');if(!el)ok=false;else answers[q[0]]=el.value});if(!ok){document.getElementById('msg').textContent='Devi acquisire tutte le deposizioni prima di proseguire.';return}localStorage.setItem('od_061_answers',JSON.stringify(answers));localStorage.setItem('od_061_interrogations','1');localStorage.setItem('od_061_progress','40');location.href='indizi.html'}</script></body></html>
