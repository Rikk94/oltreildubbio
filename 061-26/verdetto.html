<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>061/26 — Verdetto</title><link rel="stylesheet" href="../phase-shell.css"><style>.judgment{background:#f1eee5;color:#171717;padding:28px;margin-top:18px}.judgment h2{font:700 18px Georgia;border-bottom:1px solid #aaa;padding-bottom:10px}.judgment p{line-height:1.65}.result{font-weight:700;font-size:19px}</style></head><body><main><section class="panel"><div class="tag">FASE 05 · VERDETTO</div><h1>La Porta Aperta</h1><p>Il verdetto non premia l’ipotesi più suggestiva. Misura quanto la tua ricostruzione regge alle prove.</p></section><section id="judgment" class="judgment"></section><button id="save" class="btn">DEPOSITA IL VERDETTO →</button></main><script src="../phase-shell.js"></script><script>
const raw=localStorage.od_061_reconstruction;if(!raw){location.replace('fascicolo.html')}const rec=JSON.parse(raw||'{}'),h=rec.hyp,answers=JSON.parse(localStorage.od_061_answers||'{}'),reviewed=JSON.parse(localStorage.od_061_reviewed||'[]'),unlocked=JSON.parse(localStorage.od_061_unlocked||'[]');
const has=(x)=>reviewed.includes(x)||unlocked.includes(x), strong=has('E14')||has('E15'), late=has('E13'), witness=has('E11'), keyClaudia=has('E12');
let type='unresolved',title='IL PROCEDIMENTO RESTA APERTO',reason='Gli elementi raccolti non consentono di attribuire con sufficiente certezza la responsabilità a una persona.';
if(h==='B'&&strong){type='access';title='RICOSTRUZIONE COMPATIBILE, RESPONSABILITÀ NON DIMOSTRATA';reason='Le anomalie sulle chiavi rendono plausibile un accesso autorizzato o non ricostruito, ma non identificano chi abbia agito.'}
else if(h==='D'&&keyClaudia&&late){type='wrong';title='ACCUSA NON SUFFICIENTEMENTE DIMOSTRATA';reason='La disponibilità di una chiave e il contatto delle 23:12 sono elementi rilevanti, ma non provano da soli l’azione omicidiaria.'}
else if(h==='A'&&witness&&strong){type='intruder';title='IPOTESI DELL’INTRUSO: POSSIBILE, NON PROVATA';reason='L’ingresso alle 23:03 e le anomalie sulle chiavi sostengono una pista, ma il volto non è identificabile e manca un collegamento individualizzante.'}
else if(h==='C'){type='window';title='IPOTESI DELLA FINESTRA RESPINTA';reason='Una finestra socchiusa non dimostra un ingresso. La ricostruzione non supera il livello della possibilità.'}
const labels={access:'ESITO 01',wrong:'ESITO 02',intruder:'ESITO 03',window:'ESITO 04',unresolved:'ESITO 05'};
document.getElementById('judgment').innerHTML='<div class="tag">'+(labels[type]||'ESITO')+'</div><h2>DECISIONE</h2><p class="result">'+title+'</p><p>'+reason+'</p><h2>VALUTAZIONE</h2><p>Elementi esaminati: '+reviewed.length+'. Piste aggiuntive sbloccate: '+unlocked.length+'. Risposte acquisite: '+Object.keys(answers).length+'.</p><p><strong>Principio:</strong> la porta accostata, la finestra e una presenza nel palazzo sono fatti compatibili con più scenari. Nessuno di questi elementi, isolatamente, identifica l’autore.</p>';
document.getElementById('save').onclick=function(){localStorage.od_061_verdict=JSON.stringify({type,title,reason,hyp:h,reviewed:reviewed.length,unlocked:unlocked.length});localStorage.od_061_progress='100';location.href='archivio.html'};
</script></body></html>
