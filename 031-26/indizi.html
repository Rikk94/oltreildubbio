<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>031/26 — Indizi</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.6}main{max-width:900px;margin:auto;padding:40px 22px}.e{background:#111822;border:1px solid #303947;padding:18px;margin:12px 0}.tag{font:10px Arial;letter-spacing:2px;color:#c8b77d}.btn{display:inline-block;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;text-decoration:none;font:11px Arial;margin-top:16px}</style><main><div class="tag">FASE 03 · INDIZI · 031/26</div><h1>Confronto delle dichiarazioni</h1><p>Esamina gli elementi. In questo caso la domanda centrale è: il dettaglio è stato ricordato o introdotto?</p><div id="g"></div><a class="btn" href="ricostruzione.html">RICOSTRUZIONE →</a><script>const E=[['E01','Prima deposizione','Giacca scura e cappuccio. Nessun dettaglio sul volto.'],['E02','Seconda deposizione','Compare una possibile cicatrice sul volto.'],['E03','Collega della testimone','Riferisce di aver parlato con lei della cicatrice prima del secondo colloquio.'],['E04','Illuminazione','La lampada del passaggio si spegne a intervalli irregolari.'],['E05','Telecamera','Ripresa parziale del passaggio; il volto non è distinguibile.'],['E06','Tempo di osservazione','La testimone stima pochi secondi, senza poter indicare una durata precisa.'],['E07','Fotografie','La testimone riconosce una somiglianza, ma dichiara di non poter identificare con certezza.'],['E08','Dichiarazione iniziale','Non viene mai menzionata una cicatrice.']];let R=JSON.parse(localStorage.od_031_reviewed||'[]'),g=document.getElementById('g');E.forEach(e=>{let d=document.createElement('label');d.className='e';d.innerHTML='<input type="checkbox" value="'+e[0]+'"> <b>'+e[1]+'</b><p>'+e[2]+'</p>';let c=d.querySelector('input');c.checked=R.includes(e[0]);c.onchange=()=>{c.checked?R.push(e[0]):R=R.filter(x=>x!==e[0]);localStorage.od_031_reviewed=JSON.stringify([...new Set(R)])};g.appendChild(d)})</script></main></html>
