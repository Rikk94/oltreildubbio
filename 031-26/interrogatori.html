<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>031/26 — Interrogatori</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.6}main{max-width:900px;margin:auto;padding:40px 22px}.w{background:#111822;border:1px solid #303947;padding:20px;margin:16px 0}.q{display:block;width:100%;margin:8px 0;padding:12px;background:#0d131c;color:#eee;border:1px solid #384252;text-align:left}.ans{margin:8px 0;padding:12px;border-left:3px solid #c8b77d;background:#0d131c}.tag{font:10px Arial;letter-spacing:2px;color:#c8b77d}.btn{display:inline-block;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;text-decoration:none;font:11px Arial;margin-right:8px}</style><main><div class="tag">FASE 02 · INTERROGATORI · 031/26</div><h1>La memoria della testimone</h1><p>Interroga senza suggerire la risposta. Alcuni dettagli cambiano dopo domande specifiche.</p><div id="app"></div><p><a class="btn" href="indizi.html">VAI AGLI INDIZI →</a><a class="btn" href="fascicolo.html">FASCICOLO</a></p><script>const Q=[['q1','Dove si trovava alle 00:30?','Ero sul marciapiede. Ho visto due persone vicino a Valentina.'],['q2','Ha visto il volto?','Per un attimo. Direi un uomo sui trent’anni, ma la luce cambiava continuamente.'],['q3','Come era vestito?','Giacca scura e cappuccio. Questo lo ricordo bene.'],['q4','Quale mano usava?','Credo la destra. Non ne sono certa.'],['q5','Ha già raccontato questo particolare?','No, non mi era stato chiesto.'],['q6','Ha parlato con qualcuno dell’accaduto?','Il giorno dopo ne ho parlato con una collega. Mi ha detto che in zona c’era un uomo con una cicatrice.'],['q7','La cicatrice l’aveva vista lei?','No. Dopo averne parlato ho iniziato a chiedermi se forse l’avessi notata.'],['q8','Può indicare una persona tra queste fotografie?','Posso indicarne una, ma non posso dire che sia quella che ho visto quella notte.']];let A=JSON.parse(localStorage.od_031_answers||'{}'),app=document.getElementById('app');Q.forEach(q=>{let w=document.createElement('div');w.className='w';w.innerHTML='<div class="tag">DOMANDA '+q[0].slice(1)+'</div><button class="q">▸ '+q[1]+'</button>';let b=w.querySelector('button');b.onclick=()=>{if(A[q[0]])return;A[q[0]]=1;localStorage.od_031_answers=JSON.stringify(A);let x=document.createElement('div');x.className='ans';x.textContent=q[2];b.after(x);b.disabled=true};app.appendChild(w)});</script></main></html>
