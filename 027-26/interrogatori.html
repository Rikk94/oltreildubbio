<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>027/26 — Interrogatori</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.6}main{max-width:900px;margin:auto;padding:40px 22px}.w{background:#111822;border:1px solid #303947;margin:16px 0;padding:20px}.q{width:100%;display:block;margin:8px 0;padding:12px;text-align:left;background:#0d131c;color:#eee;border:1px solid #384252;cursor:pointer}.ans{margin:10px 0;padding:14px;border-left:3px solid #c8b77d;background:#0d131c}.btn{display:inline-block;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;text-decoration:none;font:11px Arial;letter-spacing:1px}.ey,.tag{font:10px Arial;letter-spacing:3px;color:#c8b77d}</style><main><div class="ey">FASE 02 · INTERROGATORI · 027/26</div><h1>Le persone che erano intorno a Matteo</h1><p>Apri tutte le deposizioni. Alcune informazioni compaiono solo se poni la domanda giusta.</p><div id="app"></div><p><a class="btn" href="fascicolo.html">← FASCICOLO</a> <a class="btn" href="indizi.html" id="next">VAI AGLI INDIZI →</a></p><script>const W=[{id:'a',name:'Sara Serra',role:'sorella',qs:[['Ultima volta che hai sentito Matteo?','Mi ha chiamata alle 22:41. Era agitato e mi ha detto che doveva incontrare qualcuno. Non ha detto chi.'],['Aveva paura?','No. Ma continuava a controllare l’ora.'],['Conoscevi le sue chiavi?','Aveva due mazzi. Uno in casa, uno lo portava con sé.'] ]},{id:'b',name:'Luca Ferri',role:'addetto alla sorveglianza',qs:[['Cosa mostra il video delle 23:06?','L’auto passa davanti alla telecamera. Non posso identificare il conducente.'],['Cosa accade alle 23:27?','Il flusso si interrompe per 47 secondi. Il sistema riprende senza riavvio.'],['Hai visto qualcuno vicino all’auto?','Nel fotogramma immediatamente precedente compare una figura sul marciapiede, ma è troppo lontana per identificarla.'] ]},{id:'c',name:'Chiara Riva',role:'collega',qs:[['Quando hai visto Matteo l’ultima volta?','Alle 21:55, fuori dal lavoro. Mi disse che avrebbe fatto una deviazione prima di tornare a casa.'],['Con chi doveva incontrarsi?','Aveva ricevuto un messaggio da un contatto salvato come “M.”.'],['Perché era importante?','Matteo aveva scoperto che qualcuno aveva usato il suo badge aziendale senza autorizzazione.'] ]},{id:'d',name:'Paolo Neri',role:'meccanico',qs:[['Chi aveva accesso all’auto?','Matteo e, mesi prima, la sua ex compagna Giulia.'],['Il sedile era normalmente così?','No. Matteo guidava molto più vicino al volante.'],['Il finestrino posteriore?','Non dovrebbe restare aperto da solo.'] ]}];let A=JSON.parse(localStorage.od_027_answers||'{}');const app=document.getElementById('app');W.forEach(w=>{let d=document.createElement('div');d.className='w';d.innerHTML='<div class="tag">'+w.role.toUpperCase()+'</div><h2>'+w.name+'</h2>';w.qs.forEach((q,i)=>{let id=w.id+i;let b=document.createElement('button');b.className='q';b.textContent='▸ '+q[0];b.onclick=()=>{A[id]=1;localStorage.od_027_answers=JSON.stringify(A);let x=document.createElement('div');x.className='ans';x.textContent=q[1];b.after(x);b.disabled=true;update()};d.appendChild(b)});app.appendChild(d)});function update(){let n=Object.keys(A).length;localStorage.od_027_interrogations=n>=12?'1':'0'}update();</script></main></html>
