<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>027/26 — Verdetto</title><style>body{margin:0;background:#ece8de;color:#171a20;font:16px Georgia;line-height:1.7}main{max-width:850px;margin:auto;padding:55px 25px}.head{text-align:center;border-bottom:1px solid #999;padding-bottom:25px}.section{margin:28px 0}.stamp{display:inline-block;border:2px solid #777;padding:8px 16px;font:11px Arial;letter-spacing:2px}.btn{display:inline-block;padding:12px 18px;border:1px solid #555;color:#222;text-decoration:none;font:11px Arial;margin-right:8px}</style><main><div class="head"><div>TRIBUNALE DI OLTRE IL DUBBIO</div><h1>PROVVEDIMENTO FINALE</h1><div>Procedimento penale n. 027/26 · L'Ultima Corsa</div></div><div id="out"></div><p><a class="btn" href="archivio.html">ARCHIVIO DEL PROCEDIMENTO</a><a class="btn" href="javascript:window.print()">STAMPA</a></p><script>const r=JSON.parse(localStorage.od_027_reconstruction||'{}'),a=JSON.parse(localStorage.od_027_answers||'{}'),rev=JSON.parse(localStorage.od_027_reviewed||'[]'),links=JSON.parse(localStorage.od_027_links||'[]');if(!r.hyp||!r.events||r.events.length<4){location.href='ricostruzione.html'}const strong=Object.keys(a).length>=12&&rev.length>=7&&links.length>=2;let decision=r.hyp==='B'?'RESPONSABILITÀ DA ACCERTARE: l’ipotesi dell’incontro con persona conosciuta è coerente con più elementi, ma il fascicolo non consente di attribuire con certezza la morte a un soggetto specifico.':'ESITO NON CONCLUSIVO: la ricostruzione scelta non supera il vaglio degli elementi acquisiti.';if(r.hyp==='D')decision='IPOTESI RESPINTA: un’interruzione video, da sola, non dimostra né manomissione né identità del responsabile.';document.getElementById('out').innerHTML=`<div class="section"><b>1. OGGETTO</b><p>Valutazione della morte di Matteo Serra, rinvenuto alle 06:18 nella propria automobile.</p></div><div class="section"><b>2. RICOSTRUZIONE DELLA PARTE</b><p>Eventi selezionati: ${r.events.length}. Ipotesi: ${r.hyp}.</p></div><div class="section"><b>3. ATTIVITÀ INVESTIGATIVA</b><p>Sono state poste ${Object.keys(a).length} domande, esaminati ${rev.length} elementi e registrati ${links.length} collegamenti.</p></div><div class="section"><b>4. VALUTAZIONE</b><p>${decision}</p></div><div class="section"><b>5. MOTIVAZIONE</b><p>Il dato temporale più delicato resta l’intervallo 23:27:14–23:28:01. La prova deve essere valutata insieme alla telefonia, alla posizione del sedile, alle tracce e agli accessi. L’assenza di effrazione non identifica chi fosse nell’auto. Anche la presenza del veicolo in un determinato punto non dimostra chi lo conducesse.</p></div><div class="section"><b>6. ESITO INVESTIGATIVO</b><p class="stamp">${strong?'FASCICOLO BEN SVILUPPATO':'INDAGINE CON ELEMENTI DA APPROFONDIRE'}</p></div>`;localStorage.od_027_verdict='1';localStorage.od_027_score=String(Math.min(100,Math.round(Object.keys(a).length/12*30+rev.length/10*25+Math.min(links.length,4)/4*20+r.events.length/6*25)))</script></main></html>
