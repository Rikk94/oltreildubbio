<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>027/26 — Indizi</title><style>body{margin:0;background:#090d14;color:#eeeae0;font:16px Georgia;line-height:1.6}main{max-width:950px;margin:auto;padding:40px 22px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.e{background:#111822;border:1px solid #303947;padding:20px}.e input{margin-right:8px}.tag{font:10px Arial;letter-spacing:2px;color:#c8b77d}.btn{display:inline-block;margin-top:20px;padding:12px 18px;border:1px solid #6d5c30;color:#c8b77d;text-decoration:none;font:11px Arial}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><main><div class="tag">FASE 03 · INDIZI · 027/26</div><h1>Laboratorio delle evidenze</h1><p>Seleziona gli elementi che ritieni utili. Devi esaminarne almeno 6 e costruire almeno una connessione.</p><div class="grid" id="g"></div><section class="e"><div class="tag">CONNESSIONE</div><p><select id="a"></select> + <select id="b"></select></p><button onclick="link()">REGISTRA COLLEGAMENTO</button><span id="msg"></span></section><p><a class="btn" href="ricostruzione.html" onclick="go()">VAI ALLA RICOSTRUZIONE →</a></p><script>const E=[['video','V-01 · 23:06','L’auto passa. Il conducente non è identificabile.'],['gap','V-03 · 47 secondi','23:27:14–23:28:01. Il sistema riprende normalmente.'],['targa','T-02 · 23:18','La targa viene rilevata da un secondo punto.'],['phone','Telefonia · 22:41','Ultima chiamata registrata da Matteo.'],['forensic','Medico-legale','Intervallo preliminare 23:10–00:20.'],['seat','Sedile conducente','Posizione insolitamente arretrata.'],['mud','Traccia di fango','Sul tappetino passeggero. Origine da verificare.'],['window','Finestrino','Posteriore destro leggermente abbassato.'],['key','Chiavi','Un mazzo nel vano portaoggetti; secondo mazzo assente.'],['badge','Badge','Matteo aveva segnalato un uso non autorizzato del badge.']];let R=new Set(JSON.parse(localStorage.od_027_reviewed||'[]')),L=JSON.parse(localStorage.od_027_links||'[]');const g=document.getElementById('g');E.forEach(x=>{g.innerHTML+=`<label class="e"><input type="checkbox" value="${x[0]}" ${R.has(x[0])?'checked':''} onchange="review(this)"><div class="tag">${x[1]}</div><p>${x[2]}</p></label>`});['a','b'].forEach(id=>{let s=document.getElementById(id);E.forEach(x=>s.innerHTML+=`<option value="${x[0]}">${x[1]}</option>`) });function review(c){c.checked?R.add(c.value):R.delete(c.value);localStorage.od_027_reviewed=JSON.stringify([...R])}function link(){let a=document.getElementById('a').value,b=document.getElementById('b').value;if(a===b)return;let k=[a,b].sort().join('|');if(!L.includes(k))L.push(k);localStorage.od_027_links=JSON.stringify(L);document.getElementById('msg').textContent=' · Collegamenti: '+L.length}function go(){if(R.size<6||L.length<1){alert('Esamina almeno 6 indizi e registra almeno una connessione.');return false}localStorage.od_027_indizi='1';return true}</script></main></html>
