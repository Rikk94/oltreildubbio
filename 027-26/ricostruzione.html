`<label class="p"><input type="checkbox" value="${i}" ${s.has(i)?'checked':''} onchange="this.checked?s.add(${i}):s.delete(${i});localStorage.od_027_events=JSON.stringify([...s])"> <b>${x[0]}</b> — ${x[1]}</label>`);function finish(){let h=document.querySelector('input[name=h]:checked');if(s.size<4||!h){alert('Seleziona almeno 4 eventi e un’ipotesi.');return}localStorage.od_027_reconstruction=JSON.stringify({events:[...s],hyp:h.value});location.href='verdetto.html'}</script></main></html>
